[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iolaus"
version = "0.1.0"
description = "Verified state transitions for AI agents, backed by HydraDB OSS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "HydraBite Hack Hydra submission"}]
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.8",
]

[project.optional-dependencies]
demo = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.3", "pytest-cov>=5"]

[project.scripts]
iolaus = "iolaus.cli:main"

[tool.setuptools.packages.find]
include = ["iolaus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live HydraDB OSS graph-node"]
addopts = "-ra"
pythonpath = ["src", "."]
